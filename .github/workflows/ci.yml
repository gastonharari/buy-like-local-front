name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  models: read        # deploy-summary step calls GitHub Models with the GITHUB_TOKEN (free, no API key)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the deploy-summary step can list the push's commits.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint --if-present
      - name: Build
        run: npm run build

      # ── Discord deploy notification (only on merge to main) ──────────
      # The landing page is deployed by Vercel, not by this workflow — so
      # these steps fire when CI passes on a push to main, i.e. right as
      # Vercel is deploying the same commit. On pull_request runs every
      # step below is skipped (`github.event_name == 'push'`). The summary
      # is written by GitHub Models (free — built-in GITHUB_TOKEN) and
      # posted to the same #deploys channel as the backend. Every notify
      # step is continue-on-error and never reds the run; the failure step
      # uses `failure()`, untouched by continue-on-error step failures.
      - name: Collect commits in this deploy
        id: commits
        if: github.event_name == 'push' && success()
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git rev-parse --verify --quiet "${BEFORE}^{commit}" >/dev/null; then
            range="${SHA}~1..${SHA}"          # first push of the branch: fall back to the last commit
          else
            range="${BEFORE}..${SHA}"
          fi
          git log "$range" --no-merges --pretty=format:'- %s%n%b' 2>/dev/null \
            | head -c 6000 > deploy-commits.txt || true
          [ -s deploy-commits.txt ] || git log -1 --pretty=format:'- %s%n%b' > deploy-commits.txt

      - name: Generate functional summary (GitHub Models — free)
        id: summary
        if: github.event_name == 'push' && success()
        continue-on-error: true
        uses: actions/ai-inference@v1
        with:
          model: openai/gpt-4o-mini
          max-completion-tokens: 400
          temperature: 0.3
          system-prompt: |
            Sos el asistente de release notes de un equipo de producto. Recibís
            los commits de un deploy de la landing page de Concierge y escribís
            un resumen MUY conciso y funcional para un canal de Discord, para
            gente no técnica.
            Reglas:
            - Español rioplatense.
            - Máximo 5 viñetas, una por línea, empezando con "- ".
            - Cada viñeta arranca con un verbo en pasado, primera persona del
              plural: "Agregamos...", "Arreglamos...", "Mejoramos...".
            - Describí QUÉ cambió para el usuario o el negocio, sin jerga técnica
              (nada de archivos, funciones ni nombres de código).
            - Agrupá lo puramente técnico (refactors, tests, bumps) en una sola
              viñeta "Mejoras internas", o omitilo si es trivial.
            - Sin título ni introducción ni cierre. Solo las viñetas.
          prompt-file: deploy-commits.txt

      - name: Notify Discord — landing deploy OK
        if: github.event_name == 'push' && success()
        continue-on-error: true
        env:
          WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          SUMMARY: ${{ steps.summary.outputs.response }}
          COMPARE_URL: ${{ github.server_url }}/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.sha }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          if [ -n "$SUMMARY" ]; then
            printf '%s' "$SUMMARY" > deploy-desc.txt
          else
            { echo "⚠️ Resumen automático no disponible. Cambios:"; cat deploy-commits.txt; } > deploy-desc.txt
          fi
          head -c 3900 deploy-desc.txt > deploy-desc.capped.txt
          jq -n \
            --rawfile desc deploy-desc.capped.txt \
            --arg url "$COMPARE_URL" \
            --arg footer "landing · ${SHORT_SHA:0:7}" \
            '{embeds:[{title:"🌐 Deploy de la landing",url:$url,description:$desc,color:13935988,footer:{text:$footer}}]}' \
            > deploy-discord.json
          curl -sS -X POST -H "Content-Type: application/json" -d @deploy-discord.json "$WEBHOOK"

      - name: Notify Discord — landing deploy failed
        if: github.event_name == 'push' && failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          jq -n \
            --arg msg "${HEAD_MSG%%$'\n'*}" \
            --arg run "$RUN_URL" \
            --arg footer "landing · ${SHORT_SHA:0:7}" \
            '{embeds:[{title:"❌ Deploy de la landing falló",description:($msg + "\n\n[Ver el run en GitHub Actions](" + $run + ")"),color:15548997,footer:{text:$footer}}]}' \
            > deploy-discord.json
          curl -sS -X POST -H "Content-Type: application/json" -d @deploy-discord.json "$WEBHOOK"

  # Playwright e2e smoke test. `npm ci` picks up legacy-peer-deps from the
  # repo-root .npmrc automatically (same as the build job). The Playwright
  # webServer option boots `next dev -p 3001` itself — no manual server step.
  # Caches the Chromium binary keyed on the lockfile; installs browser-only on
  # a cache hit.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright (browser + OS deps, cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright (browser only, cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install chromium
      - name: Run Playwright e2e smoke
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # e2e coverage gate — WARN ONLY, never blocks a merge. Flags PRs that change
  # product code without adding/updating a test under e2e/**. Implemented as a
  # single actions/github-script step (GitHub's first-party action): reads the
  # PR's changed files via the REST API — no checkout, no git, no gh/jq — and
  # writes the warning with the Actions toolkit + Octokit. The whole body is
  # wrapped in try/catch so the job always succeeds. Guarded to pull_request
  # events (this workflow also runs on push to main, where there is no PR).
  e2e-coverage:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # Job-level permissions REPLACE the workflow default.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // e2e coverage gate — WARN ONLY. Never fails CI, never blocks a merge.
            // Runs entirely on the GitHub API: no checkout, no git, no gh/jq.
            try {
              const MARKER = '<!-- e2e-coverage-gate -->';
              const E2E_DESC = 'e2e/**';
              const { owner, repo } = context.repo;
              const pr = context.payload.pull_request;

              // Classify a path — precedence: exempt -> e2e -> product -> ignored.
              const isExempt = (f) =>
                /\.(md|css|svg|docx)$/.test(f) ||
                f.startsWith('.github/') ||
                f.endsWith('package.json') || f.endsWith('package-lock.json') ||
                f.startsWith('public/') || f.startsWith('assets/') || f.startsWith('styles/') ||
                ['next.config.mjs', 'postcss.config.mjs', 'components.json', 'tsconfig.json', 'next-env.d.ts', 'playwright.config.ts'].includes(f);
              const isE2e = (f) => f.startsWith('e2e/');
              const isProduct = (f) =>
                f.startsWith('app/') ||
                f.startsWith('components/') ||
                f.startsWith('lib/') ||
                f.startsWith('hooks/');

              // 1. The PR's changed files — straight from the REST API (paginated).
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner, repo, pull_number: pr.number, per_page: 100,
              });
              const product = [];
              let e2e = 0;
              for (const { filename } of files) {
                if (isExempt(filename)) continue;
                if (isE2e(filename)) { e2e++; continue; }
                if (isProduct(filename)) product.push(filename);
              }
              core.info(`PR: ${files.length} file(s) — product ${product.length}, e2e ${e2e}`);

              // 2. Escape hatch: `skip-e2e` label or `[skip-e2e]` in the title.
              const labels = (pr.labels || []).map((l) => l.name);
              let skip = '';
              if (labels.includes('skip-e2e')) skip = 'el label `skip-e2e`';
              else if ((pr.title || '').includes('[skip-e2e]')) skip = '`[skip-e2e]` en el título';

              // 3. Decide, then build the sticky-comment body (both carry MARKER).
              const warn = product.length > 0 && e2e === 0 && !skip;
              let body;
              if (warn) {
                body = [
                  MARKER,
                  '### ⚠️ Cobertura e2e — este PR no agrega tests e2e',
                  '',
                  `Este PR cambia **código de producto** pero no agrega ni actualiza ningún test e2e en \`${E2E_DESC}\`.`,
                  '',
                  'Es una **advertencia, no un bloqueo** — CI sigue verde y podés mergear. Pero la convención del repo es que cada feature viaja con su test e2e.',
                  '',
                  `<details><summary>Archivos de producto sin cobertura e2e (${product.length})</summary>`,
                  '',
                  ...product.map((f) => `- \`${f}\``),
                  '',
                  '</details>',
                  '',
                  `**Para limpiar este aviso:** agregá/actualizá un test en \`${E2E_DESC}\`, o poné el label \`skip-e2e\`, o \`[skip-e2e]\` en el título del PR.`,
                  '',
                  '_Se re-evalúa en cada push; este comentario se actualiza solo._',
                ].join('\n');
              } else {
                const ok = skip
                  ? `Chequeo de cobertura e2e salteado vía ${skip}.`
                  : product.length === 0
                    ? 'Este PR no cambia código de producto — no requiere test e2e.'
                    : `Este PR actualiza tests e2e en \`${E2E_DESC}\` (${e2e} archivo/s). ¡Gracias!`;
                body = [MARKER, '### ✅ Cobertura e2e — OK', '', ok].join('\n');
              }

              // 4. Warning annotation + job summary (always visible).
              if (warn) {
                core.warning(
                  `El PR cambia código de producto sin tests e2e en ${E2E_DESC}. Solo aviso — CI sigue verde.`,
                  { title: 'Cobertura e2e' },
                );
              }
              await core.summary.addRaw(body.slice(MARKER.length + 1)).write();

              // 5. Sticky PR comment — find by marker, update in place or create once.
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pr.number, per_page: 100,
              });
              const prev = comments.find((c) => c.body && c.body.includes(MARKER));
              if (prev) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: prev.id, body });
                core.info(`Sticky comment updated (#${prev.id}).`);
              } else if (warn) {
                await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
                core.info('Sticky warning comment created.');
              } else {
                core.info('Clean PR, no prior comment — nothing to post.');
              }
            } catch (err) {
              // WARN ONLY: a gate failure must never red the PR.
              core.warning(`e2e-coverage gate skipped (non-fatal): ${err.message}`);
            }
